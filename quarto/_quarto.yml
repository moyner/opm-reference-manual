project:
  type: book
  output-dir: _book
filters:
  - keyword_link_filter.lua

book:
  title: "OPM Flow Reference Manual"
  subtitle: "2025-04"
  author: "Open Porous Media"
  date: "2025"
  search: true
  repo-url: https://github.com/OPM/opm-reference-manual
  chapters:
    - index.qmd
    - text: "Introduction"
      href: chapters/01-introduction.qmd
    - text: "Installing and Running Flow"
      href: chapters/02-installation.qmd
    - text: "Keyword Documentation Structure"
      href: chapters/03-keyword-structure.qmd
    - text: "Global Section Keywords"
      href: chapters/04-global-keywords.qmd
    - text: "RUNSPEC Section"
      href: chapters/05-runspec.qmd
    - text: "GRID Section"
      href: chapters/06-grid.qmd
    - text: "EDIT Section"
      href: chapters/07-edit.qmd
    - text: "PROPS Section"
      href: chapters/08-props.qmd
    - text: "REGIONS Section"
      href: chapters/09-regions.qmd
    - text: "SOLUTION Section"
      href: chapters/10-solution.qmd
    - text: "SUMMARY Section"
      href: chapters/11-summary.qmd
    - text: "SCHEDULE Section"
      href: chapters/12-schedule.qmd
  appendices:
    - text: "Keyword Summary"
      href: appendices/A-keyword-summary.qmd
    - text: "Release Notes"
      href: appendices/B-release-notes.qmd
    - text: "OPMRUN"
      href: appendices/C-opmrun.qmd
    - text: "Python Interface"
      href: appendices/D-python.qmd
    - text: "Command Line Options"
      href: appendices/E-command-line.qmd
    - text: "Output File Formats"
      href: appendices/F-output-formats.qmd

format:
  html:
    theme:
      light: cosmo
    css: styles.css
    code-fold: true
    toc: true
    toc-depth: 3
    number-sections: true
    smooth-scroll: true
    link-external-newwindow: true
  pdf:
    documentclass: scrreprt
    number-sections: true
    toc: true
    toc-depth: 2
    colorlinks: true
    keep-tex: false
    geometry:
      - margin=1in
    include-in-header:
      text: |
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
